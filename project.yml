# XcodeGen spec. Generate the project with ./build.sh (or `xcodegen generate`).
# The generated Refine.xcodeproj is gitignored: edit this file, not the project.
name: Refine

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    # The JS copy script reads the submodule and your local.config.js.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  RefineCore:
    path: Vendor/refine-popclip/RefineCore

targets:
  Refine:
    type: application
    platform: iOS
    sources: [HostApp]
    dependencies:
      - target: RefineKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        INFOPLIST_FILE: HostApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO

  RefineKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    dependencies:
      - package: RefineCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
    postCompileScripts:
      - name: Bundle Refine JS
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          EXT="$SRCROOT/Vendor/refine-popclip/Refine.popclipext"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/js"
          if [ ! -f "$EXT/prompt.js" ]; then
            echo "error: $EXT/prompt.js not found. Run: git submodule update --init"
            exit 1
          fi
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp "$EXT/config.js" "$EXT/prompt.js" "$EXT/redact.js" "$DEST/"
          if [ -n "${REFINE_LOCAL_CONFIG:-}" ] && [ -f "$REFINE_LOCAL_CONFIG" ]; then
            cp "$REFINE_LOCAL_CONFIG" "$DEST/local.config.js"
            echo "Bundled your local.config.js from $REFINE_LOCAL_CONFIG"
          else
            echo "warning: No local.config.js at REFINE_LOCAL_CONFIG; using the default style profile."
          fi
          # Catch a typo in the JS now instead of on the phone.
          NODE="$(command -v node || ls /opt/homebrew/bin/node /usr/local/bin/node 2>/dev/null | head -1 || true)"
          if [ -n "$NODE" ]; then
            for f in "$DEST"/*.js; do "$NODE" --check "$f"; done
          fi

schemes:
  Refine:
    build:
      targets:
        Refine: all
        RefineKeyboard: all
    run:
      config: Debug
